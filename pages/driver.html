<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driver home · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/driver.css">
  <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="module" src="/js/pages/driver.js"></script>
</head>
<body class="page page--driver">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Draft C: earnings first, requests as a list, the live map in a card that opens full screen -->
      <div class="content__inner content__inner--full dhome" id="driverHome" hidden>
        <section class="dhero" aria-labelledby="driverTitle">
          <div class="dhero__money">
            <h1 class="dhero__hi" id="driverTitle">Hi, <span data-bind="firstName">driver</span>. You’ve earned today</h1>
            <p class="dhero__today" data-bind="today">₱0</p>
            <p class="dhero__meta"><b data-bind="todayTrips">0 trips</b> today · <b data-bind="week">₱0</b> this week
              <span class="badge" data-bind="vehicle">Vehicle</span> <span class="badge" data-bind="status">Approved</span></p>
          </div>
          <button type="button" class="onbar" id="onlineBtn" aria-pressed="false">
            <span class="onbar__dot" aria-hidden="true"></span>
            <span class="onbar__text"><b data-bind="onlineTitle">You’re offline</b><small data-bind="onlineHint">Go online to get requests near you.</small></span>
            <span class="onbar__go" data-bind="onlineAction">Go online</span>
          </button>
        </section>

        <div class="dgrid">
          <section class="card dreq" aria-labelledby="reqCount">
            <div class="dreq__head" id="reqHead">
              <h2 id="reqCount">Requests</h2>
              <div class="fchips" id="kinds" role="group" aria-label="Show requests for"></div>
            </div>
            <div id="activeJob" aria-live="polite"></div>
            <ul class="jobs" id="jobList" aria-labelledby="reqCount" aria-live="polite"></ul>
          </section>

          <!-- Every request is a pin; the picked one (or the accepted job) shows its route -->
          <section class="dmap" id="mapCard" aria-label="Map of job requests near you">
            <div class="map__canvas" id="mapCanvas"></div>
            <button type="button" class="dmap__btn" id="mapToggle" aria-expanded="false">
              <svg class="icon icon--sm icon--deep" aria-hidden="true"><use href="/assets/images/icons.svg#i-pin"/></svg><span>Full map</span>
            </button>
            <button type="button" class="dmap__locate" id="locateBtn" aria-label="Center on my location">
              <svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-locate"/></svg>
            </button>
          </section>

          <section class="card dtrips" aria-labelledby="earnTitle">
            <h2 class="card__title" id="earnTitle">Latest trips</h2>
            <ul class="list" id="trips"></ul>
          </section>

          <div class="card row dpayout">
            <span class="file__icon"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-wallet"/></svg></span>
            <div class="row__main"><span class="row__title">Payout method</span><span class="row__sub" data-bind="payout">Not set up yet</span></div>
            <button type="button" class="button button--ghost" id="payoutBtn">Set up</button>
          </div>
        </div>
        <p class="finder__note">You keep 100% of every fare. Riders’ tips go to mysabak, which is why there are no fees.</p>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="drive" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
