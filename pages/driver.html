<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driver home · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <script>try{if(sessionStorage.getItem('mysabak.glow'))document.documentElement.classList.add('arriving')}catch(e){}</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/driver.css">
  <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="module" src="/js/pages/driver.js"></script>
</head>
<body class="page page--head-sky page--driver">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Drive is only the work: today in one line, the online switch, then the requests (the nearest as the big
           card, the rest below; tap one to swap it in). Earnings, Trips and Account are their own tabs. -->
      <div class="content__inner content__inner--full dhome" id="driverHome" hidden>
        <header class="page-head dsky">
          <div class="dsky__inner">
            <!-- Today in one line; the rest of the money is on Earnings -->
            <p class="dtoday"><span>Today <b data-bind="today">₱0</b></span><span data-bind="todayTrips">0 trips</span><a href="/pages/driver-earnings.html">Earnings →</a></p>
            <div class="dgo">
              <p class="dgo__status" id="onlineStatus"><b data-bind="onlineTitle">You’re offline</b><span data-bind="onlineHint">Go online to get Ride, Express and Shop requests.</span></p>
              <button type="button" class="dgo__switch" id="onlineBtn" role="switch" aria-checked="false" aria-describedby="onlineStatus"><span class="dgo__knob" aria-hidden="true"></span><span class="sr-only" data-bind="onlineAction">Go online</span></button>
            </div>
          </div>
        </header>

        <section class="dreq" aria-labelledby="reqCount">
          <div class="dreq__head"><h2 class="dreq__title" id="reqCount">Requests</h2><button type="button" class="dreq__map" id="mapBtn"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-pin"/></svg>Map</button></div>
          <div id="activeJob" aria-live="polite"></div>
          <div id="jobList" aria-live="polite"></div>
        </section>

        <p class="finder__note">You keep 100% of every fare. Riders’ tips go to mysabak, which is why there are no fees.</p>
      </div>
    </main>

    <!-- Full-screen live map: every request, a route preview, or turn-by-turn navigation to the next stop -->
    <section class="dmapview" id="mapView" aria-label="Map" hidden>
      <div class="map__canvas" id="mapCanvas"></div>
      <div class="dturn" id="turn" hidden>
        <span class="dturn__icon" id="turnIcon" aria-hidden="true"></span>
        <span class="dturn__text"><b id="turnIn"></b><span id="turnText"></span></span>
      </div>
      <p class="dturn__then" id="turnThen" hidden></p>
      <button type="button" class="dmapview__locate" id="locateBtn" aria-label="Center on my location">
        <svg class="icon icon--lg" aria-hidden="true"><use href="/assets/images/icons.svg#i-locate"/></svg>
      </button>
      <div class="dsheet" id="mapSheet" aria-live="polite"></div>
    </section>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="drive" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
