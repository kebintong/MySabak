<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shop · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; assets/js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="module" src="/assets/js/pages/shop.js"></script>
</head>
<body class="page page--shop">
  <div class="app">
    <!-- Top bar and tab bar are filled in by assets/js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content" id="content">
      <div class="shop-layout">

        <!-- Where the shop is: route map + shop card -->
        <aside class="shop-side" aria-label="About the shop">
          <div class="shop-hero">
            <div class="shop-hero__map"><div class="shop-hero__canvas" id="heroMap"></div></div>
            <a class="shop-hero__back" href="/pages/shops.html" aria-label="Back to shops"><svg class="icon icon--lg icon--ink" aria-hidden="true"><use href="/assets/images/icons.svg#i-back"/></svg></a>
            <span class="shop-hero__eta" id="eta" hidden></span>
          </div>
          <div class="shop-info">
            <span class="shop-info__ava" id="shopAva" aria-hidden="true"></span>
            <div class="shop-info__body">
              <h1 class="shop-info__name" id="shopName">Shop</h1>
              <p class="shop-info__addr" id="shopAddr"></p>
              <p class="shop-info__facts" id="shopFacts"></p>
            </div>
            <div class="shop-info__actions">
              <a class="shop-info__link" id="directions" href="#" target="_blank" rel="noopener"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/images/icons.svg#i-pin"/></svg>Get directions</a>
              <a class="shop-info__link" id="phone" href="#"><svg class="icon icon--sm" aria-hidden="true"><use href="/assets/images/icons.svg#i-phone"/></svg><span></span></a>
            </div>
          </div>
          <p class="shop-about" id="shopAbout"></p>
        </aside>

        <!-- Menu: section tabs, then each section -->
        <div class="shop-main">
          <nav class="menu-tabs" id="menuTabs" aria-label="Menu sections"></nav>
          <div id="menu"></div>
          <p class="finder__note">Prices are what the shop charges; the delivery fee goes 100% to your rider.</p>
        </div>

        <!-- Your order: a side column on wide screens, a sheet on phones and tablets -->
        <dialog class="cart-panel" id="cartPanel" aria-labelledby="cartTitle">
          <div class="cart-panel__head">
            <h2 id="cartTitle">Your order</h2>
            <button type="button" class="icon-btn cart-panel__close" id="cartClose" aria-label="Close"><svg class="icon icon--lg icon--ink" aria-hidden="true"><use href="/assets/images/icons.svg#i-close"/></svg></button>
          </div>
          <div class="cart-panel__body" id="cartBody"></div>
        </dialog>
      </div>
    </main>

    <button type="button" class="cart-pill" id="cartPill" aria-controls="cartPanel" aria-expanded="false" hidden>
      <span id="cartCount">0 items</span><b id="cartPillTotal">View order</b>
    </button>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="shops" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
