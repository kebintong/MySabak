<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <script>try{if(sessionStorage.getItem('mysabak.glow'))document.documentElement.classList.add('arriving')}catch(e){}</script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/merchant-home.css">
  <script type="module" src="/js/pages/merchant-home.js"></script>
</head>
<body class="page page--head-sky page--merchant">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner content__inner--full">
        <div id="dashboard" class="stack mdash" hidden>
          <!-- Night sky: shop, branch, greeting, Accept orders switch (js/pages/merchant-common.js) -->
          <header class="page-head mhead" data-mhead></header>

          <!-- Right now · Sales · Mood board; they rise into the sky -->
          <div class="mcards">
            <section class="card dcard dcard--now" aria-labelledby="nowTitle" style="--enter: 1">
              <h2 class="card__title" id="nowTitle">Right now</h2>
              <div class="nowcounts skel-block" style="--skel-h: 72px" id="nowCounts"></div>
              <ul class="nowlist" id="nowList" aria-live="polite"></ul>
              <a class="button button--block nowpos" href="/pos"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-receipt"/></svg>Open POS</a>
            </section>
            <section class="card dcard" aria-labelledby="salesTitle" style="--enter: 2">
              <div class="card__title--row">
                <h2 class="card__title" id="salesTitle">Sales</h2>
                <div class="sseg" role="tablist" aria-label="Period" id="salesRange">
                  <button type="button" role="tab" data-range="day" aria-selected="true">Today</button>
                  <button type="button" role="tab" data-range="week" aria-selected="false">Week</button>
                  <button type="button" role="tab" data-range="month" aria-selected="false">Month</button>
                </div>
              </div>
              <div class="sales skel-block" style="--skel-h: 200px" id="sales" aria-live="polite"></div>
            </section>
            <section class="card dcard" aria-labelledby="moodTitle" style="--enter: 3">
              <h2 class="card__title card__title--row" id="moodTitle">Mood board <span class="muted small">Today</span></h2>
              <div class="mood" id="mood" aria-live="polite"></div>
            </section>
          </div>

          <!-- Owner: every branch at a glance -->
          <section class="card" id="branchesToday" aria-labelledby="branchesTitle" style="--enter: 4" hidden>
            <h2 class="card__title card__title--row" id="branchesTitle">Branches today <span class="card__aside" id="branchCount"></span></h2>
            <ul class="bglance" id="branchGlance"></ul>
            <a class="quietlink" href="/pages/merchant-manage.html">Manage branches<svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-chevron"/></svg></a>
          </section>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="merchant" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
