<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/merchant-home.css">
  <script type="module" src="/js/pages/merchant-home.js"></script>
</head>
<body class="page page--head-sky page--merchant">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner content__inner--full">
        <div id="dashboard" class="stack mdash" hidden>
          <!-- Night sky: shop, branch, greeting, Accept orders switch (js/pages/merchant-common.js) -->
          <header class="page-head mhead" data-mhead></header>

          <!-- Right now · Preview analytics · Mood board; they rise into the sky -->
          <div class="mcards">
            <section class="card dcard dcard--now" aria-labelledby="nowTitle">
              <h2 class="card__title card__title--row" id="nowTitle">Right now <a class="muted small" href="/pages/merchant-pos.html#online">Open POS →</a></h2>
              <div class="nowcounts" id="nowCounts"></div>
              <ul class="nowlist" id="nowList" aria-live="polite"></ul>
              <a class="button button--block" href="/pages/merchant-pos.html">Open POS</a>
            </section>
            <section class="card dcard" aria-labelledby="previewTitle">
              <h2 class="card__title card__title--row" id="previewTitle">Preview analytics <span class="muted small">Tap for details</span></h2>
              <div class="ptiles" id="previewTiles"></div>
            </section>
            <section class="card dcard" aria-labelledby="moodTitle">
              <h2 class="card__title card__title--row" id="moodTitle">Mood board <span class="muted small">Today</span></h2>
              <div class="mood" id="mood" aria-live="polite"></div>
            </section>
          </div>

          <!-- Owner: every branch at a glance -->
          <section class="card" id="branchesToday" aria-labelledby="branchesTitle" hidden>
            <h2 class="card__title card__title--row" id="branchesTitle">Branches today <a class="muted small" href="/pages/merchant-manage.html">Manage branches →</a></h2>
            <ul class="bglance" id="branchGlance"></ul>
          </section>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="merchant" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
