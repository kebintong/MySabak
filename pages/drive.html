<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Driver sign in · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <script type="module" src="/js/pages/drive.js"></script>
</head>
<body class="page page--sky page--head-sky">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner content__inner--wide">

        <div class="signin">
          <header class="page-head signin__head">
            <div>
              <h1 class="page-title" id="signinTitle">Driver sign in</h1>
              <p class="lede">Welcome back. Sign in to go online and keep 100% of every fare.</p>
            </div>
            <nav class="role-switch role-switch--glass" aria-label="Sign in as">
              <a class="role-switch__btn" href="/pages/account.html"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-user"/></svg>Customer</a>
              <a class="role-switch__btn" href="/pages/drive.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-wheel"/></svg>Driver</a>
              <a class="role-switch__btn" href="/pages/merchant.html"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-store"/></svg>Merchant</a>
            </nav>
          </header>

          <div class="signin__body">
              <form class="form" id="signinForm" novalidate>
                <label class="field"><span class="field__label">Mobile number or email</span>
                  <input class="input" name="login" type="text" required placeholder="09XX XXX XXXX or name@email.com"
                         autocomplete="username" autocapitalize="off" spellcheck="false"></label>
                <div class="field"><label class="field__label" for="password">Password</label>
                <div class="input-wrap"><input class="input" id="password" name="password" type="password" required minlength="8" autocomplete="current-password">
                <button type="button" class="input-wrap__btn" data-reveal="password" aria-label="Show password">Show</button></div></div>
                <div class="auth-row">
                  <label class="check"><input type="checkbox" name="remember" checked><span>Keep me signed in</span></label>
                  <a href="#" class="auth-link" id="forgot">Forgot password?</a>
                </div>
                <p class="field__error" id="signinError" role="alert" hidden></p>
                <button type="submit" class="button button--block" id="signinBtn">Sign in</button>
                <p class="auth-legal">By signing in, you agree to mysabak’s <a href="#" data-soon="Terms of Service">Terms of Service</a> and <a href="#" data-soon="Privacy Policy">Privacy Policy</a>.</p>
              </form>
              <p class="signin__new"><span class="signin__ask">Wanna work as a driver?</span> <span class="signin__hint">Apply to drive and keep 100% of every fare.</span> <a class="auth-link auth-link--strong" href="/pages/drive-signup.html">Sign up</a></p>
          </div>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="drive" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
