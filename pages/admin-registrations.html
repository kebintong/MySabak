<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Registrations · Admin · mysabak</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/pages/admin-registrations.js"></script>
</head>
<body class="page page--sky page--head-sky page--admin">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Shown only once the signed-in account is an admin (js/pages/admin-registrations.js) -->
      <div class="content__inner" id="regPage" hidden>
        <header class="page-head">
          <div class="ahead__row">
            <div>
              <h1 class="page-title">Registrations</h1>
              <p class="lede" id="intro">Check each applicant’s papers, then approve, send back to fix, or reject.</p>
            </div>
            <span class="sample-chip" id="sampleChip" hidden>Sample applicants</span>
            <nav class="role-switch role-switch--glass" aria-label="Who applied" id="kinds"></nav>
          </div>
        </header>

        <div class="reg rise" id="reg">
          <section class="card reglist" aria-label="Applications" style="--enter: 1">
            <div class="seg seg--stack" role="tablist" aria-label="Status" id="stabs"></div>
            <ul class="list" id="rows"></ul>
          </section>

          <article class="card glow-border review" id="review" aria-live="polite" style="--enter: 2"></article>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="adminReg" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
