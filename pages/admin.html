<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · mysabak</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/pages/admin.js"></script>
</head>
<body class="page page--sky">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Shown only once the signed-in account is an admin (js/pages/admin.js) -->
      <div class="content__inner stack" id="adminHome" hidden>
        <header class="page-head">
          <h1 class="page-title">Admin</h1>
          <p class="lede" id="whoLine">Signed in</p>
        </header>

        <section class="card" aria-labelledby="driversTitle">
          <h2 class="card__title card__title--row" id="driversTitle">Driver registrations <span class="badge badge--wait" id="driverCount">0</span></h2>
          <ul class="list" id="driverApps"></ul>
        </section>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="admin" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
