<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin · mysabak</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/pages/admin.js"></script>
</head>
<body class="page page--sky page--head-sky page--admin">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Shown only once the signed-in account is an admin (js/pages/admin.js) -->
      <div class="content__inner" id="adminHome" hidden>
        <header class="page-head">
          <div class="ahead__row">
            <div>
              <p class="eyebrow" id="greeting">Good day</p>
              <h1 class="page-title">Overview</h1>
              <p class="lede" id="dateLine">Today</p>
            </div>
            <span class="sample-chip" id="sampleChip" hidden>Sample numbers</span>
          </div>
        </header>

        <section class="counts rise" aria-label="Live counts" id="counts"></section>

        <div class="agrid agrid--lead">
          <section class="card glow-border" aria-labelledby="waitTitle" style="--enter: 4">
            <h2 class="card__title card__title--row" id="waitTitle">Waiting for review <a class="card__link" href="/pages/admin-registrations.html">See all</a></h2>
            <ul class="list" id="waitList"></ul>
          </section>

          <div class="acol">
            <section class="card" aria-labelledby="todayTitle" style="--enter: 5">
              <h2 class="card__title" id="todayTitle">Today so far</h2>
              <div class="today" id="today"></div>
              <div class="svcbar" id="svcbar" role="img"></div>
              <ul class="legend" id="svcLegend"></ul>
            </section>

            <section class="card wtipsc" aria-labelledby="wtipsTitle" style="--enter: 6">
              <h2 class="card__title card__title--row" id="wtipsTitle">Weekly tips <a class="card__link" href="/pages/admin-analytics.html">Analytics</a></h2>
              <div class="wtips7__top">
                <b class="count__now" id="wtipsTotal"></b>
                <span class="kpi6__d" id="wtipsChange"></span>
              </div>
              <p class="tiphint">Tips to mysabak, last 7 days. Point at or tap a day.</p>
              <div class="wbars" id="wtipsBars" role="group"></div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="admin" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
