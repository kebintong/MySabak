<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Management · Admin · mysabak</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script type="module" src="/js/pages/admin-management.js"></script>
</head>
<body class="page page--sky page--head-sky page--admin">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <!-- Shown only once the signed-in account is an admin (js/pages/admin-management.js) -->
      <div class="content__inner" id="mgmtPage" hidden>
        <header class="page-head">
          <div class="ahead__row">
            <div>
              <h1 class="page-title">Management</h1>
              <p class="lede">Find any account, fix its details, or turn it off. Share sign-up links with new drivers and shops.</p>
            </div>
            <span class="sample-chip" id="sampleChip" hidden>Sample accounts</span>
          </div>
        </header>

        <!-- Status tiles: the count of each, and a tap filters the list -->
        <section class="stiles rise" id="stiles" role="group" aria-label="Filter by status"></section>

        <div class="mgmt" id="mgmt">
          <section class="card ulist" aria-labelledby="usersTitle" style="--enter: 1">
            <div class="ulist__head">
              <h2 class="card__title" id="usersTitle">Accounts</h2>
              <div class="mtools">
                <label class="search"><span class="sr-only">Search accounts</span>
                  <svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-search"/></svg>
                  <input class="input" type="search" id="q" placeholder="Search name, shop, email or mobile" autocomplete="off">
                </label>
                <div class="seg seg--stack" role="group" aria-label="Role" id="roles"></div>
              </div>
              <p class="ucount" id="ucount" aria-live="polite"></p>
            </div>
            <div id="urows"></div>
            <div class="ulist__foot"><button type="button" class="button button--ghost cta" id="more" hidden>Show more</button></div>
          </section>

          <article class="card uprof" id="uprof" aria-live="polite" style="--enter: 2"></article>
        </div>

        <div class="agrid agrid--even">
          <section class="card" aria-labelledby="linksTitle" style="--enter: 3">
            <h2 class="card__title" id="linksTitle">Sign-up links</h2>
            <p class="lede small">Send these to people who want to join. Each opens the right sign-up page on this site.</p>
            <ul class="links" id="links"></ul>
          </section>

          <section class="card" aria-labelledby="actTitle" style="--enter: 4">
            <h2 class="card__title card__title--row" id="actTitle">Registration activity <a class="card__link" href="/pages/admin-registrations.html">Review</a></h2>
            <p class="lede small" id="actLine"></p>
            <div class="tablewrap"><table class="atable" id="activity"></table></div>
            <h3 class="subtitle subtitle--gap">Newest accounts</h3>
            <ul class="list" id="newest"></ul>
          </section>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="adminManage" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
