<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trips · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/driver.css">
  <script type="module" src="/js/pages/driver-trips.js"></script>
</head>
<body class="page page--sky page--driver">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner">
        <header class="page-head">
          <a class="page-head__back" href="/pages/driver.html"><svg class="icon icon--sm icon--deep" aria-hidden="true"><use href="/assets/images/icons.svg#i-back"/></svg><span>Drive</span></a>
          <h1 class="page-title">Trips</h1>
          <p class="lede" id="tripsSum" aria-live="polite"></p>
        </header>

        <!-- Every trip, by type, 10 a page, grouped by day (js/pages/driver-trips.js) -->
        <div class="fchips tfilter" id="tripKinds" role="group" aria-label="Show"></div>
        <section class="card dtrips" aria-labelledby="tripsTitle">
          <h2 class="sr-only" id="tripsTitle">Your trips</h2>
          <ul class="tdays skel-rows" id="tripList"></ul>
        </section>
        <div class="tpages" id="tripPages" hidden>
          <nav class="tpages__nav" aria-label="Pages" id="pageNav"></nav>
          <p class="tpages__note" id="pageNote"></p>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="drive" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
