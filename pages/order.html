<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your order · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/order.css">
  <script type="module" src="/js/pages/order.js"></script>
</head>
<body class="page page--sky">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner">

        <header class="page-head">
          <!-- Back to the page you came from (js/pages/order.js backLink); Trips & Orders when there's none -->
          <a class="page-head__back" id="backLink" href="/pages/trips.html"><svg class="icon icon--sm icon--deep" aria-hidden="true"><use href="/assets/images/icons.svg#i-back"/></svg><span>Trips &amp; Orders</span></a>
          <h1 class="page-title">Your order</h1>
        </header>

        <div id="notFound" class="card" hidden><p class="empty">We couldn’t find this order.</p></div>

        <!-- The order as a receipt ticket: status stamp, steps, lines, order number; actions under it (js/pages/order.js) -->
        <div id="orderBody" class="order" hidden>
          <article class="ticket" aria-labelledby="shopName">
            <p class="ticket__stamp" id="stamp" role="status"><span class="ticket__live" aria-hidden="true"></span><span id="stampText"></span></p>
            <div>
              <h2 class="ticket__shop" id="shopName"></h2>
              <p class="ticket__meta" id="orderMeta"></p>
              <p class="ticket__meta" id="orderTo"></p>
            </div>
            <div class="ticket__segs" id="segs" aria-hidden="true"></div>
            <div class="ticket__steps" id="steps" aria-hidden="true"></div>
            <div class="ticket__cut" aria-hidden="true"></div>
            <dl class="ticket__lines" id="receipt"></dl>
            <div class="ticket__id"><span>Order number</span><code id="orderId"></code></div>
          </article>

          <div class="ticket__acts">
            <a class="tact" id="trackBtn" href="/pages/trips.html"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-pin"/></svg>Track on map</a>
            <a class="tact" id="callBtn" href="#" hidden><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-phone"/></svg>Call shop</a>
            <button type="button" class="tact tact--gold" id="tipBtn"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-heart"/></svg><span>Tip mysabak</span></button>
          </div>

          <p class="demo-note">Demo: no real shop or rider is connected. A sample shop’s order moves along by itself over a few minutes; the demo merchant’s orders move when the merchant updates them.</p>
        </div>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="food" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
