<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trips &amp; Orders · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/trips.css">
  <script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <script type="module" src="/js/pages/trips.js"></script>
</head>
<body class="page page--sky">
  <div class="app">
    <!-- Top bar and tab bar are filled in by js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner">

        <!-- Ongoing / Rides / Food: what's on its way now, then each kind's history (js/pages/trips.js) -->
        <header class="page-head">
          <h1 class="page-title">Trips &amp; Orders</h1>
          <div class="tswitch" role="group" aria-label="Show">
            <button type="button" data-show="ongoing" aria-pressed="true">Ongoing <span class="tswitch__n" id="ongoingN" hidden></span></button>
            <button type="button" data-show="rides" aria-pressed="false">Rides</button>
            <button type="button" data-show="food" aria-pressed="false">Food</button>
          </div>
        </header>

        <section class="tpanel" aria-live="polite">
          <ul class="tlist" id="tripsList"></ul>
          <div class="tquick" id="quick">
            <h2 class="tquick__title">Start something</h2>
            <div class="tquick__row">
              <a class="tquick__go" href="/#ride"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-car"/></svg>Book a ride</a>
              <a class="tquick__go" href="/pages/shops.html"><svg class="icon" aria-hidden="true"><use href="/assets/images/icons.svg#i-food"/></svg>Order food</a>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="trips" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
