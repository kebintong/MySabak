<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Trips · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; assets/js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/pages/trips.js"></script>
</head>
<body class="page page--sky">
  <div class="app">
    <!-- Top bar and tab bar are filled in by assets/js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner">

        <header class="page-head">
          <h1 class="page-title">Trips</h1>
          <p class="lede">Your rides, deliveries and shop orders.</p>
        </header>

        <section class="card" aria-labelledby="ridesTitle">
          <h2 class="card__title" id="ridesTitle">Rides and deliveries</h2>
          <ul class="list" id="rideList"></ul>
          <a class="button button--block card__action" href="/#ride">Book a ride</a>
        </section>

        <section class="card" aria-labelledby="ordersTitle">
          <h2 class="card__title" id="ordersTitle">Shop orders</h2>
          <ul class="list" id="orderList"></ul>
        </section>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="trips" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
