<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shops · mysabak</title>
  <meta name="theme-color" content="#5630d8">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/pages/shops.js"></script>
</head>
<body class="page">
  <div class="app">
    <!-- Top bar and tab bar are filled in by assets/js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <div class="content__inner content__inner--wide">

        <header class="page-head">
          <h1 class="page-title">Shops</h1>
          <p class="lede">Order from local shops. Delivered by mysabak riders, who keep 100% of the delivery fee.</p>
        </header>
        <p class="demo-note">Demo: these are sample shops with made-up menus.</p>

        <div class="field">
          <label for="shopSearch" class="sr-only">Search shops and items</label>
          <div class="searchbox"><svg class="icon icon--lg" aria-hidden="true"><use href="/assets/images/icons.svg#i-search"/></svg><input class="input" id="shopSearch" type="search" placeholder="Search shops or items" autocomplete="off"></div>
        </div>
        <div class="chips chips--wrap" id="categories" role="group" aria-label="Categories"></div>

        <section aria-label="Shops near you"><ul class="shop-grid" id="shopList"></ul></section>

        <section class="card" id="ordersCard" aria-labelledby="ordersTitle" hidden>
          <h2 class="card__title" id="ordersTitle">Your orders</h2>
          <ul class="list" id="orderList"></ul>
        </section>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="shops" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
