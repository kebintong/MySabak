<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Checkout · mysabak</title>
  <meta name="theme-color" content="#5b2596">
  <link rel="manifest" href="/assets/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="mysabak">
  <!-- Catch the browser's install prompt early; assets/js/ui.js (setupInstall) uses it -->
  <script>addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__installPrompt = e; });</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script type="module" src="/assets/js/pages/checkout.js"></script>
</head>
<body class="page page--shop page--checkout">
  <div class="app">
    <!-- Top bar and tab bar are filled in by assets/js/ui.js (mountChrome) -->
    <header class="topbar" data-topbar></header>

    <main class="content">
      <header class="shop-sky">
        <div class="shop-sky__inner">
          <a class="shop-back" id="backToShop" href="/pages/shops.html" aria-label="Back to shop"><svg class="icon icon--lg icon--white" aria-hidden="true"><use href="/assets/images/icons.svg#i-back"/></svg></a>
          <div class="shop-info__title">
            <h1 class="shop-info__name">Checkout</h1>
            <p class="shop-info__addr" id="shopName"></p>
          </div>
        </div>
      </header>

      <div class="check-layout">
        <div id="emptyCart" class="card" hidden>
          <p class="empty">Your cart is empty.</p>
          <a class="button button--block" href="/pages/shops.html">Browse shops</a>
        </div>

        <!-- Draft C: three steps, one open at a time, each showing its choice when closed -->
        <form id="checkoutForm" class="check-form" autocomplete="off" hidden>
          <div class="steps">
            <section class="step" data-panel="order">
              <h2 class="step__h"><button type="button" class="step__head" aria-expanded="false" aria-controls="stepOrder">
                <span class="step__num" aria-hidden="true">1</span>
                <span class="step__text"><span class="step__title">Your order</span><span class="step__peek"><span id="peekOrder"></span></span></span>
                <span class="step__action" aria-hidden="true">Edit</span>
              </button></h2>
              <div class="step__body" id="stepOrder"><div class="step__clip"><div class="step__inner">
                <ul class="list" id="lines"></ul>
              </div></div></div>
            </section>

            <section class="step is-open is-settled" data-panel="deliver">
              <h2 class="step__h"><button type="button" class="step__head" aria-expanded="true" aria-controls="stepDeliver">
                <span class="step__num" aria-hidden="true">2</span>
                <span class="step__text"><span class="step__title">Deliver to</span><span class="step__peek"><span id="peekDeliver"></span></span></span>
                <span class="step__action" aria-hidden="true">Edit</span>
              </button></h2>
              <div class="step__body" id="stepDeliver"><div class="step__clip"><div class="step__inner form">
                <div class="field">
                  <label for="address" class="field__label">Address or place</label>
                  <input class="input" id="address" type="text" placeholder="Search a street, building or landmark" required
                         role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="addressList">
                  <ul class="suggest" id="addressList" role="listbox" aria-label="Suggested places" hidden></ul>
                </div>
                <button type="button" class="button button--ghost" id="useLocation"><svg class="icon " aria-hidden="true"><use href="/assets/images/icons.svg#i-locate"/></svg>Use my location</button>
                <label class="field"><span class="field__label">Notes for the rider <span class="muted">(optional)</span></span>
                  <textarea class="textarea" name="notes" placeholder="Unit number, gate, landmark…"></textarea></label>
              </div></div></div>
            </section>

            <section class="step" data-panel="pay">
              <h2 class="step__h"><button type="button" class="step__head" aria-expanded="false" aria-controls="stepPay">
                <span class="step__num" aria-hidden="true">3</span>
                <span class="step__text"><span class="step__title">Pay with</span><span class="step__peek"><span id="peekPay"></span></span></span>
                <span class="step__action" aria-hidden="true">Change</span>
              </button></h2>
              <div class="step__body" id="stepPay"><div class="step__clip"><div class="step__inner">
                <fieldset class="pills" id="payMethods"><legend class="sr-only">Payment method</legend></fieldset>
              </div></div></div>
            </section>
          </div>

          <section class="check-sum" aria-labelledby="sumTitle">
            <h2 class="check-sum__title" id="sumTitle">Summary</h2>
            <dl class="receipt" id="summary"></dl>
            <button type="submit" class="button button--block" id="placeBtn">Place order</button>
            <p class="card__foot">No service fee. You can tip mysabak after delivery if you like.</p>
          </section>
        </form>
      </div>
    </main>

    <div class="bottom">
      <nav class="dock tabs" data-tabs="food" aria-label="Main"></nav>
    </div>
  </div>
</body>
</html>
